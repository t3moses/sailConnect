<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Connection, community, growth logo">
  <title>Connection · Community · Growth</title>
  <defs>
    <!-- Flat rope colours -->
    <pattern id="ropeA" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="3.2" height="3.2" fill="#1F6F8B"/>
    </pattern>
    <pattern id="ropeB" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="3.2" height="3.2" fill="#2E9E5B"/>
    </pattern>
    <!-- Rope paths (knot coordinates) -->
    <path id="green" d="M84 50 H46 Q42 50 42 54 V70 A5 5 0 0 1 32 70 V32 A8 8 0 0 1 48 32 V78"/>
    <path id="blue" d="M13 36 H50 A14 14 0 0 1 50 64 H22"/>
    <!-- Over/under after flipping: blue crosses on top here, and the tail crosses over the standing part -->
    <path id="blueOverTop" d="M44 36 H52"/>
    <path id="blueOverBottom" d="M38 64 H52"/>
    <path id="tailOver" d="M48 54 V46"/>
    <!-- Transparent gaps: each mask cuts a clear outline where another rope passes over -->
    <mask id="cutGreen" maskUnits="userSpaceOnUse" x="-100" y="-100" width="300" height="300">
      <rect x="-100" y="-100" width="300" height="300" fill="#fff"/>
      <use href="#blueOverTop" fill="none" stroke="#000" stroke-width="10.5"/>
      <use href="#blueOverBottom" fill="none" stroke="#000" stroke-width="10.5"/>
      <use href="#tailOver" fill="none" stroke="#000" stroke-width="8"/>
    </mask>
    <mask id="cutBlue" maskUnits="userSpaceOnUse" x="-100" y="-100" width="300" height="300">
      <rect x="-100" y="-100" width="300" height="300" fill="#fff"/>
      <use href="#green" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- Sheet bend, turned over 180 degrees about the bottom-left to top-right diagonal:
       the picture is mirrored across that diagonal and every over/under crossing is reversed -->
  <!-- Fit the drawing inside the square -->
  <g transform="translate(50 50) scale(0.92) translate(-47.5 -56.25)">
  <g transform="matrix(0 -1 -1 0 100 100)">
    <g fill="none" stroke-linejoin="round"
       transform="translate(57.5 45) rotate(-45) scale(1.5) translate(-53 -51)">
      <use href="#blue" stroke="url(#ropeA)" stroke-width="7" stroke-linecap="round" mask="url(#cutBlue)"/>
      <use href="#green" stroke="url(#ropeB)" stroke-width="5" stroke-linecap="round" mask="url(#cutGreen)"/>
      <!-- Top-side pieces, drawn a hair longer than their gaps so no seam shows -->
      <path d="M43.7 36 H52.3" stroke="url(#ropeA)" stroke-width="7"/>
      <path d="M37.7 64 H52.3" stroke="url(#ropeA)" stroke-width="7"/>
      <path d="M48 54.3 V45.7" stroke="url(#ropeB)" stroke-width="5"/>
    </g>
  </g>
  </g>
</svg>
